# ==============================================================================
# Face Recognition System Configuration
# ==============================================================================

camera:
  device: 0               # Camera index (0 for default webcam, or path/URL to video file/RTSP)
  width: 640              # Capture frame width
  height: 480             # Capture frame height
  fps: 30                 # Target capture frame rate
  buffer_size: 1          # Capture buffer size to minimize video latency

face_recognition:
  tolerance: 0.6          # Distance threshold for face match (lower = stricter, higher = looser)
  model: "hog"            # Detection model: 'hog' (fast CPU) or 'cnn' (GPU/higher accuracy)
  encoding_model: "large" # Landmark model: 'large' (68 points) or 'small' (5 points)
  process_interval: 3     # Process face recognition every N frames for CPU performance optimization
  upsample: 1             # Number of times to upsample image for small face detection

storage:
  known_faces_dir: "known_faces"
  captured_images_dir: "captured_images"
  encodings_file: "data/face_encodings.dat"
  database_file: "data/database.db"
  history_file: "data/recognition_history.csv"

ui:
  window_name: "Face Recognition System"
  show_fps: true
  show_confidence: true
  theme: "dark"
  cooldown_seconds: 5     # Seconds between logging duplicate recognition for the same person

anti_spoofing:
  enabled: true                 # Master toggle for biometric liveness verification
  ear_threshold: 0.22           # Eye Aspect Ratio threshold (below this is considered closed eye)
  consecutive_closed_frames: 2  # Minimum consecutive frames below threshold to count as blink
  texture_analysis: true        # Screen moire / digital screen replay detection
  privacy_blur_bystanders: false # Automatic Gaussian blur on unknown / bystander faces
  head_pose: true               # 3D Head pose estimation (solvePnP Euler angles & nose ray)
  challenge_response: false     # Interactive challenge-response mode (turn left/right, nod down)
  challenge_timeout: 5.0        # Timeout in seconds to complete dynamic liveness challenges

audio:
  enabled: false                # Offline text-to-speech voice announcements upon face recognition
  cooldown_seconds: 15.0        # Seconds before greeting the same person again
  rate: 170                     # Speech rate (words per minute)

api:
  host: "127.0.0.1"             # Listening host address
  port: 8000                    # Listening TCP port
  cors_origins: ["*"]           # Allowed CORS origins
  enable_docs: true             # Enable Swagger UI (/docs) and ReDoc (/redoc)

rtsp:
  enabled: false                # Ingest video from network RTSP IP camera feed
  url: "rtsp://admin:password@192.168.1.100:554/h264"
  reconnect_interval_seconds: 3.0
  max_reconnect_attempts: 50

motion_detection:
  enabled: false                # Only run face recognition when environmental motion is detected
  min_area: 800                 # Minimum pixel contour area to register active motion
  threshold: 25.0               # Background subtraction variance threshold
  cooldown_frames: 20           # Maintain detection active for N frames after motion settles

webhooks:
  enabled: false                # Outbound HTTP alerts on security events
  endpoints: []                 # Target webhook URLs (e.g. Slack, Discord, SIEM)
  cooldown_seconds: 30.0        # Anti-spam deduplication cooldown window
  include_snapshot: true        # Attach Base64 JPEG thumbnail preview to alert payload


